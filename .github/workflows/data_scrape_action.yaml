name: Nepse data auto scraping

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *' # 11:15 UTC = 17:00 NPT, after market close

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager
      # downloads the matching chromedriver at runtime.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python app.py

      - name: Commit and push data
        run: |
          git config --local user.email "bhupinbaral.729@gmail.com"
          git config --local user.name "bhupinbaral25"
          git add newdata
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "scrapped successfully!"
            git push origin main
          fi
